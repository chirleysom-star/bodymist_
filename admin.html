<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title { font-size: clamp(2rem, 4vw, 2.8rem); }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2);
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }

    #ordersTable th {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      background: var(--cream);
      border-bottom: 1px solid var(--line);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head text-center">
          <h1 class="page-title">รายการสั่งซื้อ</h1>
          <span class="rule"></span>
          <p class="muted">เรียงจากรายการล่าสุดขึ้นก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 Body Scent</span>
      <span>เติมเต็มตัวตน สร้างความมั่นใจ</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
